name: frontend-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-tests:
    runs-on: ubuntu-latest

    # Все шаги — из frontend/ (пакет живёт там; зеркалит `cd frontend && ...` из justfile).
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Parity с dev-окружением (node 24), где сьют валидируется. На node 20
          # перехват blob-ответа в MSW (axios responseType:"blob" через jsdom XHR)
          # зависает — это несовместимость ТЕСТ-инфры, не баг приложения (в браузере
          # XHR blob работает). Держим CI на том же major, что и локальная разработка.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npx tsc -b --noEmit

      - name: Run frontend tests (vitest)
        # `npm test` = `vitest --run` (одноразовый прогон, не watch).
        run: npm test
