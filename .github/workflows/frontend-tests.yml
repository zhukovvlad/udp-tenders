name: frontend-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-tests:
    runs-on: ubuntu-latest

    # Все шаги — из frontend/ (пакет живёт там; зеркалит `cd frontend && ...` из justfile).
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"   # Vite 6 / React 19; поднять, если команда стандартизирует выше.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npx tsc -b --noEmit

      - name: Run frontend tests (vitest)
        # `npm test` = `vitest --run` (одноразовый прогон, не watch).
        run: npm test
