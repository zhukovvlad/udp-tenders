name: backend-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    # Postgres + pgvector on the runner itself → localhost queries (~0.1ms) instead
    # of remote Neon round-trips. The official pgvector image ships the `vector`
    # extension, which the migration chain (enable_pgvector_extension) requires.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: udp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The app constructs its engine from DATABASE_URL at import time, so it must be set.
      # Tests use TEST_DATABASE_URL. The two MUST differ: conftest skips integration when
      # TEST_DATABASE_URL == DATABASE_URL (a DROP SCHEMA safety guard). DATABASE_URL points
      # at the always-present `postgres` db; tests run against the `udp_test` db.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/udp_test
      SECRET_KEY: ci-only-secret-key-not-for-production-min-32-chars

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # AGENTS.md: Python 3.12+. Bump if the team standardises higher.
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-test.txt

      - name: Lint (ruff)
        run: cd backend && ruff check .

      - name: Run backend tests (unit + integration)
        # conftest applies Alembic to head on TEST_DATABASE_URL once per session;
        # pgvector image makes CREATE EXTENSION vector succeed.
        run: cd backend && pytest
