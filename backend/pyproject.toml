[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --tb=short"
# Targeted suppression for third-party code not yet ported to Python 3.14:
# fastapi 0.115.x uses asyncio.iscoroutinefunction (fixed in 0.116+, skip major bump for now)
# pytest-asyncio 0.26.0 uses asyncio.get_event_loop_policy internally
filterwarnings = [
    "ignore:.*asyncio\\.iscoroutinefunction.*:DeprecationWarning:fastapi",
    "ignore:.*asyncio\\.get_event_loop_policy.*:DeprecationWarning:pytest_asyncio",
]
markers = [
    "integration: tests that hit a real Postgres (need TEST_DATABASE_URL)",
]
env_files = [".env.test"]

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "tests/*",
    "alembic/*",
    "scripts/*",
    "logging_config.py",
]

[tool.coverage.report]
# Целевой порог для зрелого test-suite (см. spec §12.1).
# Сейчас тесты только наращиваются, поэтому fail_under=0 и `just coverage-backend`
# не валится, но печатает текущее покрытие. Поднимаем по этапам.
fail_under = 0
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",   # длинные строки прощаем (длинные SQL и docstrings)
    "B008",   # FastAPI Depends() в аргументах функций — стандартный идиом FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # import-order в тестах не критичен
"alembic/versions/*" = ["E402", "F401", "UP007", "UP035"]
"scripts/*" = ["E402", "F401", "F541"]  # скрипты — не строгий production-код
"main.py" = ["E402", "F401"]  # load_dotenv() должен запуститься до локальных импортов
# Существующие prod-файлы с накопленными нарушениями — фиксим инкрементально
# (F401 unused imports, B904 raise from, SIM* стилистика). Чтобы новые файлы
# линтились строго, ignore только на конкретные файлы:
"crud.py" = ["SIM108"]
"routers/dashboard.py" = ["F401"]
"routers/export.py" = ["F401"]
"routers/invoices.py" = ["F401", "B904", "SIM105"]
